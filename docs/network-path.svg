<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="100%" role="img">
<title>校园网与热点访问GitHub的路径对比</title>
<desc>对比两条网络路径：校园网出口的DPI审查设备丢弃发往github.com的握手包导致超时；手机热点走运营商出口不受影响。api.github.com因域名和IP不同未在名单内。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="30" text-anchor="middle" style="font-size:14px;font-weight:500" fill="#2C2C2A">为什么校园网连不上 GitHub，手机热点却可以</text>
<text x="40" y="62" style="font-size:13px;font-weight:500" fill="#993C1D">路径 A · 校园网（宿舍 WiFi）</text>
<g>
<rect x="40" y="76" width="100" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="90" y="95" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:500" fill="#444441">你的电脑</text>
<text x="90" y="113" text-anchor="middle" dominant-baseline="central" style="font-size:11px" fill="#5F5E5A">发起新连接</text>
</g>
<path d="M140 102 H188" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="196" y="76" width="210" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="301" y="95" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:500" fill="#712B13">校园网出口</text>
<text x="301" y="113" text-anchor="middle" dominant-baseline="central" style="font-size:11px" fill="#993C1D">DPI 审查设备（按名单丢包）</text>
</g>
<path d="M406 102 H448" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M420 95 L434 109 M434 95 L420 109" stroke="#A32D2D" stroke-width="2" fill="none" stroke-linecap="round"/>
<g>
<rect x="456" y="76" width="184" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="548" y="95" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:500" fill="#444441">GitHub</text>
<text x="548" y="113" text-anchor="middle" dominant-baseline="central" style="font-size:11px" fill="#5F5E5A">20.205.243.166</text>
</g>
<text x="340" y="152" text-anchor="middle" style="font-size:12px" fill="#791F1F">SNI=github.com 命中名单 → SYN 包被静默丢弃 → 连接超时（21 秒无响应）</text>
<text x="40" y="186" style="font-size:13px;font-weight:500" fill="#3B6D11">路径 B · 手机热点</text>
<g>
<rect x="40" y="200" width="100" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="90" y="219" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:500" fill="#444441">你的电脑</text>
<text x="90" y="237" text-anchor="middle" dominant-baseline="central" style="font-size:11px" fill="#5F5E5A">热点连接</text>
</g>
<path d="M140 226 H188" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="196" y="200" width="210" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="301" y="219" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:500" fill="#27500A">运营商网络</text>
<text x="301" y="237" text-anchor="middle" dominant-baseline="central" style="font-size:11px" fill="#3B6D11">出口不同，策略不同</text>
</g>
<path d="M406 226 H448" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M421 226 L427 232 L439 218" stroke="#3B6D11" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g>
<rect x="456" y="200" width="184" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="548" y="219" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:500" fill="#444441">GitHub</text>
<text x="548" y="237" text-anchor="middle" dominant-baseline="central" style="font-size:11px" fill="#5F5E5A">同一个目标</text>
</g>
<text x="340" y="276" text-anchor="middle" style="font-size:12px" fill="#27500A">TCP 握手成功 → 浏览器授权 → 推送完成</text>
<g>
<rect x="40" y="296" width="600" height="88" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="64" y="320" dominant-baseline="central" style="font-size:13px;font-weight:500" fill="#0C447C">两个连带的现象</text>
<text x="64" y="344" dominant-baseline="central" style="font-size:12px" fill="#185FA5">· api.github.com 能通：另一个域名 + 另一组 IP，不在出口黑名单里</text>
<text x="64" y="366" dominant-baseline="central" style="font-size:12px" fill="#185FA5">· 浏览器能开 GitHub 网页：多半靠 DoH/ECH/QUIC 绕开了明文 SNI——命令行 git 没有这些</text>
</g>
</svg>
